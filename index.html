<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wendler Log</title>
  <meta name="description" content="Offline 5/3/1 training log: training maxes, PR sets, estimated 1RM, history and calendar.">
  <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="5/3/1">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="view" class="view" aria-live="polite"></main>

  <div id="rest" class="rest" hidden>
    <div class="rest-bar"><div class="rest-fill"></div></div>
    <div class="rest-row">
      <span class="rest-label">Rest</span>
      <strong class="rest-time">0:00</strong>
      <button type="button" data-action="rest-adjust" data-delta="-15">−15s</button>
      <button type="button" data-action="rest-adjust" data-delta="15">+15s</button>
      <button type="button" data-action="rest-stop">Skip</button>
    </div>
  </div>

  <nav class="tabbar" aria-label="Main">
    <a href="#/today" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h2v4H3zM19 10h2v4h-2zM6 7h3v10H6zM15 7h3v10h-3zM9 11h6v2H9z"/></svg><span>Train</span></a>
    <a href="#/history" data-tab="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v2H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2zM5 9h14v10H5zm2 2v2h2v-2zm4 0v2h2v-2zm4 0v2h2v-2z"/></svg><span>History</span></a>
    <a href="#/progress" data-tab="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19h18v2H3zM4 15.6l5-5 4 4 6.3-6.3L21 10l-8 8-4-4-3.6 3.6z"/></svg><span>Progress</span></a>
    <a href="#/lifts" data-tab="lifts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h10v2H4z"/></svg><span>Program</span></a>
    <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.4 5.1-.1-3.2 2-1.6-2-3.5-2.4.9a8 8 0 0 0-2.7-1.6L14.8 2h-4l-.4 2.6a8 8 0 0 0-2.7 1.6L5.3 5.3l-2 3.5 2 1.6a8 8 0 0 0 0 3.2l-2 1.6 2 3.5 2.4-.9a8 8 0 0 0 2.7 1.6l.4 2.6h4l.4-2.6a8 8 0 0 0 2.7-1.6l2.4.9 2-3.5z"/></svg><span>Settings</span></a>
  </nav>

  <div id="sheet" class="sheet-backdrop" hidden><div class="sheet" role="dialog" aria-modal="true"></div></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
